name: Build Quartz Site
on:
  push:
    branches: ["master"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Quartz Build
        run: npx quartz build --directory Ankasekima --output ./_site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Action - notify
        uses: up9cloud/action-notify@v0.5
        env:
          GITHUB_JOB_STATUS: ${{ needs.deploy.result }}
          DISCORD_WEBHOOK_URL: ${{secrets.DISCORD_WEBHOOK_URL}}
          DISCORD_TEMPLATE_PATH: "./discord.json"
          SENDER_LOGIN: ${{github.event.sender.login}}
          SENDER_AVATAR: ${{github.event.sender.avatar_url}}
          SENDER_HTML_URL: ${{github.event.sender.html_url}}
          GITHUB_COMPARE: ${{github.event.compare}}